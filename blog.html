<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOLT. — Blog</title>
  <meta name="description" content="BOLT. Blog — thoughts on code, design, and technology." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="data/style.css" />
  <style>
    /* ---------- blog specific styles ---------- */
    .blog-hero {
      padding: 4rem 1.5rem;
      border-bottom: 1px solid var(--line);
      margin-bottom: 3rem;
    }

    .blog-hero-title {
      font-family: "Instrument Serif", serif;
      font-size: 2.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .blog-hero-sub {
      color: var(--muted-2);
      font-size: 0.95rem;
      max-width: 600px;
    }

    .blog-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem 1.5rem;
    }

    /* ---------- post list ---------- */
    #blog-post-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.5rem;
      margin-bottom: 4rem;
    }

    .blog-post-card {
      padding: 1.5rem;
      border: 1px solid var(--line);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .blog-post-card:hover {
      border-color: var(--fg);
      background: rgba(255, 255, 255, 0.02);
    }

    .blog-post-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .blog-post-title {
      font-family: "Instrument Serif", serif;
      font-size: 1.3rem;
      font-weight: 400;
      margin: 0;
      flex: 1;
    }

    .blog-post-date {
      color: var(--muted-2);
      font-size: 0.8rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .blog-post-excerpt {
      color: var(--muted);
      margin: 0 0 1rem 0;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .blog-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .blog-tag {
      display: inline-block;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--line);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-2);
    }

    /* ---------- post detail ---------- */
    #blog-post-detail {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .blog-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0;
      border: none;
      background: none;
      color: var(--fg);
      cursor: pointer;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .blog-back-btn:hover {
      color: var(--muted);
    }

    .blog-post-header {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--line);
    }

    .blog-post-title-large {
      font-family: "Instrument Serif", serif;
      font-size: 2.2rem;
      font-weight: 400;
      margin: 0 0 1rem 0;
      line-height: 1.2;
    }

    .blog-post-meta {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      color: var(--muted-2);
      font-size: 0.85rem;
    }

    .blog-post-content {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .blog-post-content h1 {
      font-family: "Instrument Serif", serif;
      font-size: 1.8rem;
      font-weight: 400;
      margin: 2.5rem 0 1rem 0;
      line-height: 1.3;
    }

    .blog-post-content h2 {
      font-family: "Instrument Serif", serif;
      font-size: 1.4rem;
      font-weight: 400;
      margin: 2rem 0 0.8rem 0;
      line-height: 1.3;
    }

    .blog-post-content h3 {
      font-family: "Instrument Serif", serif;
      font-size: 1.1rem;
      font-weight: 400;
      margin: 1.5rem 0 0.6rem 0;
      line-height: 1.3;
    }

    .blog-post-content p {
      margin-bottom: 1rem;
    }

    .blog-post-content strong {
      font-weight: 500;
      color: var(--fg);
    }

    .blog-post-content em {
      font-style: italic;
      color: var(--muted);
    }

    .blog-post-content a {
      color: var(--fg);
      text-decoration: underline;
      text-decoration-color: var(--line);
      transition: all 0.2s ease;
    }

    .blog-post-content a:hover {
      text-decoration-color: var(--fg);
    }

    .blog-post-content code {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.2rem 0.4rem;
      border: 1px solid var(--line);
      font-size: 0.9rem;
      color: var(--muted);
    }

    .blog-post-content blockquote {
      border-left: 2px solid var(--line);
      padding-left: 1.5rem;
      margin: 1.5rem 0;
      color: var(--muted);
      font-style: italic;
    }

    .blog-post-content hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 2rem 0;
    }

    .blog-post-content img {
      max-width: 100%;
      height: auto;
      margin: 1.5rem 0;
      border: 1px solid var(--line);
      display: block;
    }

    .empty-state {
      color: var(--muted-2);
      padding: 3rem 1.5rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      .blog-hero {
        padding: 2.5rem 1.5rem;
      }

      .blog-hero-title {
        font-size: 1.8rem;
      }

      .blog-post-card-header {
        flex-direction: column;
        gap: 0.5rem;
      }

      .blog-post-title {
        font-size: 1.1rem;
      }

      .blog-post-title-large {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <!-- Grain overlay -->
  <div class="grain" aria-hidden="true"></div>

  <!-- Header -->
  <header class="site-header">
    <a href="index.html" class="logo">BOLT<span class="logo-dot">.</span></a>
    <nav class="header-nav" aria-label="Primary">
      <a href="index.html#work">Work</a>
      <a href="watchlist.html">Watchlist</a>
      <a href="blog.html" class="active">Blog</a>
      <a href="index.html#contact">Contact</a>
      <span class="status"><span class="status-dot" aria-hidden="true"></span>Available for work</span>
    </nav>
  </header>

  <main>
    <!-- Blog Hero -->
    <section class="blog-hero" aria-labelledby="blog-title">
      <h1 id="blog-title" class="blog-hero-title">Blog</h1>
      <p class="blog-hero-sub">Thoughts on code, design, and technology. Raw notes on things I'm learning and building.</p>
    </section>

    <div class="blog-container">
      <!-- Blog Post List -->
      <div id="blog-post-list" aria-label="Blog posts">
        <!-- Populated by data/blog.js -->
      </div>

      <!-- Blog Post Detail -->
      <article id="blog-post-detail" aria-live="polite">
        <button class="blog-back-btn" aria-label="Back to all posts">
          <span>←</span>
          <span>Back</span>
        </button>
        <header class="blog-post-header">
          <!-- Populated by data/blog.js -->
        </header>
        <div class="blog-post-content">
          <!-- Populated by data/blog.js -->
        </div>
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <span class="mono">© <span id="year">2026</span> BOLT.</span>
    <span class="mono">Designed &amp; built by BOLT</span>
  </footer>

  <script src="data/blog.js"></script>
</body>
</html>
